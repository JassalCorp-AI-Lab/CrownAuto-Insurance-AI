[project]
name = "crownauto-insurance"
version = "0.1.0"
description = "CrownAuto Insurance AI - multi-agent Canadian car insurance assistant (LangGraph + FastAPI)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "pydantic>=2.9.2",
    "langchain-core>=0.3.78",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.50",
    "openai>=1.55.3",
    "chromadb>=1.0",
    "tiktoken>=0.8.0",
    "pydantic-settings>=2.6",
    "pyfiglet>=1.0.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
